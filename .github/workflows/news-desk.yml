name: news-desk

# IMPORTANT: GitHub only fires `schedule:` triggers for workflow files on the
# repository's DEFAULT branch. This repo's newsroom system lives on the
# `newsroom` branch, so for the cron to run you must either:
#   (a) set `newsroom` as the default branch (Settings -> Branches), or
#   (b) run it manually from the Actions tab (workflow_dispatch always works).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 */2 * * *"   # every 2 hours (UTC); private-repo schedules are throttled

concurrency:
  group: news-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: moneypuran   # secrets + variables live in this GitHub Environment
    steps:
      - uses: actions/checkout@v5
        with:
          ref: newsroom

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Connectivity diagnostic
        run: |
          echo "--- runner egress IP ---"; curl -s https://api.ipify.org || true; echo
          echo "--- homepage ---"; curl -s -o /dev/null -w "%{http_code} t=%{time_total}s\n" -A "Mozilla/5.0" https://moneypuran.com/ || echo "homepage: connect failed"
          echo "--- wp-json (browser UA) ---"; curl -s -o /dev/null -w "%{http_code} t=%{time_total}s\n" -A "Mozilla/5.0" "https://moneypuran.com/wp-json/" || echo "wp-json UA=browser: connect failed"
          echo "--- wp-json (worker UA) ---"; curl -s -o /dev/null -w "%{http_code} t=%{time_total}s\n" -A "moneypuran-newsdesk/1.0" "https://moneypuran.com/wp-json/" || echo "wp-json UA=worker: connect failed"
          echo "--- users/me no-auth ---"; curl -s -m 15 -A "Mozilla/5.0" "https://moneypuran.com/wp-json/wp/v2/users/me?context=edit" || echo "users/me: connect failed"
          echo "--- node fetch ---"; node -e 'try{const r=await fetch("https://moneypuran.com/wp-json/",{headers:{"User-Agent":"moneypuran-newsdesk/1.0"}});console.log("node fetch:",r.status)}catch(e){console.log("node fetch ERR:",e.message,"| cause:",e.cause&&(e.cause.code||e.cause.message))}'
        continue-on-error: true

      - name: Run the news desk
        working-directory: worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USERNAME: ${{ vars.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node run.mjs

      - name: Persist state
        if: always()
        run: |
          git config user.name "news-desk-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/nd && cp worker/state/seen.json worker/state/daily.json /tmp/nd/ 2>/dev/null || true
          for attempt in 1 2 3 4 5 6; do
            git fetch origin newsroom
            git reset --hard origin/newsroom
            mkdir -p worker/state
            cp /tmp/nd/seen.json /tmp/nd/daily.json worker/state/ 2>/dev/null || true
            git add worker/state/seen.json worker/state/daily.json
            if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
            git commit -m "chore(news-desk): update state [skip ci]"
            if git push origin HEAD:newsroom; then echo "state pushed (attempt $attempt)"; exit 0; fi
            echo "push $attempt rejected, re-syncing..."; sleep $((RANDOM % 5 + 3))
          done
          echo "::warning::state push failed after retries; next run re-syncs from the feeds"
