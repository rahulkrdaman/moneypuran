version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: moneypuran_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneypuran
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MoneyPuran@Secure123}
      POSTGRES_DB: moneypuran_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneypuran"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moneypuran_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-RedisPass123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneypuran_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://moneypuran:${DB_PASSWORD:-MoneyPuran@Secure123}@db:5432/moneypuran_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPass123}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: moneypuran_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://moneypuran:${DB_PASSWORD:-MoneyPuran@Secure123}@db:5432/moneypuran_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPass123}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: moneypuran_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
